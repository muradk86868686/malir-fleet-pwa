<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Gate Barrier Pillar Left -->
  <rect x="70" y="240" width="36" height="180" rx="8" fill="#334155"/>
  <rect x="62" y="400" width="52" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="88" cy="270" r="14" fill="#10b981"/>
  
  <!-- Gate Barrier Arm (Diagonal Up Open) -->
  <g transform="rotate(-30 88 270)">
    <rect x="88" y="258" width="340" height="24" rx="6" fill="#ffffff" filter="url(#shadow)"/>
    <!-- Warning Stripes -->
    <polygon points="120,258 140,258 120,282 100,282" fill="#ef4444"/>
    <polygon points="170,258 190,258 170,282 150,282" fill="#ef4444"/>
    <polygon points="220,258 240,258 220,282 200,282" fill="#ef4444"/>
    <polygon points="270,258 290,258 270,282 250,282" fill="#ef4444"/>
    <polygon points="320,258 340,258 320,282 300,282" fill="#ef4444"/>
    <polygon points="370,258 390,258 370,282 350,282" fill="#ef4444"/>
  </g>
  
  <!-- Fleet Vehicle (Truck / EV Van Silhouette) -->
  <g filter="url(#shadow)" transform="translate(180, 260)">
    <!-- Cabin & Body -->
    <path d="M 10 90 L 10 30 Q 10 10 30 10 L 140 10 Q 155 10 165 25 L 195 65 Q 200 72 210 75 L 240 75 Q 255 75 255 90 L 255 110 L 10 110 Z" fill="#0284c7"/>
    <!-- Cargo Box Area -->
    <rect x="15" y="16" width="125" height="85" rx="4" fill="#0369a1"/>
    <!-- Windshield -->
    <path d="M 152 22 L 186 62 L 146 62 L 146 22 Z" fill="#e0f2fe" opacity="0.9"/>
    <!-- Side Window -->
    <rect x="194" y="45" width="40" height="20" rx="3" fill="#bae6fd" opacity="0.85"/>
    <!-- Headlight -->
    <circle cx="248" cy="90" r="7" fill="#fef08a"/>
    <!-- Wheels -->
    <circle cx="65" cy="112" r="24" fill="#0f172a" stroke="#64748b" stroke-width="6"/>
    <circle cx="65" cy="112" r="9" fill="#94a3b8"/>
    <circle cx="205" cy="112" r="24" fill="#0f172a" stroke="#64748b" stroke-width="6"/>
    <circle cx="205" cy="112" r="9" fill="#94a3b8"/>
  </g>
  
  <!-- EV Lightning Bolt Badge -->
  <g transform="translate(340, 100) scale(1.4)" filter="url(#shadow)">
    <circle cx="25" cy="25" r="28" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3"/>
    <polygon points="28,4 12,28 24,28 20,46 38,20 26,20" fill="url(#accentGrad)"/>
  </g>
  
  <!-- Camera Lens Graphic Top Left -->
  <g transform="translate(90, 80) scale(1.2)" filter="url(#shadow)">
    <rect x="0" y="8" width="60" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="30" cy="30" r="7" fill="#38bdf8"/>
    <circle cx="48" cy="18" r="3" fill="#ef4444"/>
    <path d="M 18 8 L 24 2 L 36 2 L 42 8 Z" fill="#334155"/>
  </g>
  
  <!-- Text Label Badge -->
  <g transform="translate(60, 440)">
    <rect width="392" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" stroke-width="1.5"/>
    <text x="196" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">DISTRICT MALIR FLEET</text>
  </g>
</svg>